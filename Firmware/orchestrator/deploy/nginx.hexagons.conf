# nginx site config for the Hexagon Orchestrator — Raspberry Pi
#
# Installed by `./deploy.sh --install-nginx` to
# /etc/nginx/sites-available/hexagons (symlinked into sites-enabled/).
#
# nginx is the sole public entry point (port 80). The Flask/Waitress app
# (see main.py, deploy/hexagons.service) binds to 127.0.0.1:8080 only —
# never reachable directly from the network. nginx serves dist/ straight
# off disk for everything else, so routine deploys (which just rsync new
# files into place) need no nginx involvement at all; only changes to
# *this config file* require re-running --install-nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hexagons.local _;

    root /opt/hexagons/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A future websocket endpoint (e.g. /ws) proxied to a small
        # dedicated process would add its own location block here with:
        #   proxy_http_version 1.1;
        #   proxy_set_header Upgrade $http_upgrade;
        #   proxy_set_header Connection "upgrade";
        # — additive, not a redesign of this file.
    }

    # App is routed client-side by preact-router using real paths (e.g.
    # /tools, /sim) — any request that isn't a file on disk falls back to
    # index.html so a hard refresh or direct link resolves client-side
    # instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
